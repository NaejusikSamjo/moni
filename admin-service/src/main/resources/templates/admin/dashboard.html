<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/default :: layout(~{::title}, ~{::#page-content}, 'dashboard', ~{})}">
<head>
    <title>대시보드 - moni 관리자</title>
</head>
<body>
<div id="page-content">
    <h2 class="page-title">대시보드</h2>

    <div class="stats-grid">
        <div class="stat-card">
            <p class="label">전체 사용자</p>
            <p class="value" th:text="${totalUsers}">0</p>
        </div>
    </div>

    <a th:href="@{/admin/users}" class="btn btn-primary">
        사용자 관리 바로가기 →
    </a>
</div>
</body>
</html>
