<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>삭제된 사용자 - moni 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<header class="header">
    <span class="logo">moni 관리자</span>
    <nav>
        <a th:href="@{/admin/dashboard}">대시보드</a>
        <a th:href="@{/admin/users}">사용자 관리</a>
        <a th:href="@{/admin/users/deleted}" class="active">삭제된 사용자</a>
    </nav>
    <form id="logout-form" class="logout-form" th:action="@{/admin/logout}" method="post">
        <span class="nav-username" sec:authentication="name"></span>
        <button type="submit" class="logout-btn">로그아웃</button>
    </form>
</header>

<main class="main">
    <h2 class="page-title">삭제된 사용자</h2>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>이름</th>
                <th>이메일</th>
                <th>닉네임</th>
                <th>로그인 방식</th>
                <th>가입일</th>
                <th>삭제일</th>
                <th>삭제 사유</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${page.content}">
                <td th:text="${user.name}">-</td>
                <td th:text="${user.email}">-</td>
                <td th:text="${user.nickname}">-</td>
                <td th:text="${user.oauthProvider != null} ? ${user.oauthProvider} : '이메일'">이메일</td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">-</td>
                <td th:text="${#temporals.format(user.deletedAt, 'yyyy-MM-dd')}">-</td>
                <td th:text="${user.deletedReason}">-</td>
            </tr>

            <tr th:if="${page.content.isEmpty()}">
                <td colspan="7" class="empty-state">삭제된 사용자가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <a th:if="${page.hasPrevious()}" th:href="@{/admin/users/deleted(page=${page.number - 1})}">← 이전</a>
        <span th:unless="${page.hasPrevious()}" class="disabled">← 이전</span>

        <span class="current" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>

        <a th:if="${page.hasNext()}" th:href="@{/admin/users/deleted(page=${page.number + 1})}">다음 →</a>
        <span th:unless="${page.hasNext()}" class="disabled">다음 →</span>
    </div>
</main>

<script th:src="@{/js/inactivity.js}"></script>
</body>
</html>
