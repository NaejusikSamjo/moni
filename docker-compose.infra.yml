networks:
  default:
    name: moni-network

services:

  user-db:
    image: postgres:16-alpine
    container_name: user_db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "25432:5432"
    volumes:
      - ./.docker-volumes/user-db:/var/lib/postgresql/data

  portfolio-db:
    image: postgres:16-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: ${PORTFOLIO_DB_USERNAME}
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
    ports:
      - "25433:5432"
    volumes:
      - ./.docker-volumes/portfolio-db:/var/lib/postgresql/data

  stock-db:
    image: postgres:16-alpine
    container_name: stock_db
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: ${STOCK_DB_USERNAME}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD}
    ports:
      - "25434:5432"
    volumes:
      - ./.docker-volumes/stock-db:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: notification_db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "25435:5432"
    volumes:
      - ./.docker-volumes/notification-db:/var/lib/postgresql/data

  trade-db:
    image: postgres:16-alpine
    container_name: trade_db
    environment:
      POSTGRES_DB: trade_db
      POSTGRES_USER: ${TRADE_DB_USERNAME}
      POSTGRES_PASSWORD: ${TRADE_DB_PASSWORD}
    ports:
      - "25436:5432"
    volumes:
      - ./.docker-volumes/trade-db:/var/lib/postgresql/data

  payment-db:
    image: postgres:16-alpine
    container_name: payment_db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "25437:5432"
    volumes:
      - ./.docker-volumes/payment-db:/var/lib/postgresql/data

  ai-db:
    image: pgvector/pgvector:pg17
    container_name: ai_db
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: ${AI_DB_USERNAME}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "25438:5432"
    volumes:
      - ./.docker-volumes/ai-db:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: moni_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "26379:6379"
    volumes:
      - ./.docker-volumes/redis:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: moni_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    volumes:
      - ./.docker-volumes/zookeeper:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: moni_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    volumes:
      - ./.docker-volumes/kafka:/var/lib/kafka/data

  # Redis Cluster (stock-service 전용 — 3 master, no replica)
  redis-cluster-0:
    image: redis:7.2-alpine
    container_name: redis_cluster_0
    command: >
      redis-server --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname redis-cluster-0
      --cluster-announce-port 7000
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "7000:7000"
    volumes:
      - ./.docker-volumes/redis-cluster-0:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-1:
    image: redis:7.2-alpine
    container_name: redis_cluster_1
    command: >
      redis-server --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname redis-cluster-1
      --cluster-announce-port 7001
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "7001:7001"
    volumes:
      - ./.docker-volumes/redis-cluster-1:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-2:
    image: redis:7.2-alpine
    container_name: redis_cluster_2
    command: >
      redis-server --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname redis-cluster-2
      --cluster-announce-port 7002
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "7002:7002"
    volumes:
      - ./.docker-volumes/redis-cluster-2:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7002 -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 클러스터 초기화 — 첫 기동 시에만 실행, 이후 재시작 시 || true 로 무시
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: redis_cluster_init
    restart: "no"
    depends_on:
      redis-cluster-0:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
    command: >
      sh -c "redis-cli -a $$REDIS_CLUSTER_PASSWORD
      --cluster create
      redis-cluster-0:7000 redis-cluster-1:7001 redis-cluster-2:7002
      --cluster-replicas 0 --cluster-yes || true"
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
