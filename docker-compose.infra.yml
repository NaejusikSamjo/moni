networks:
  default:
    name: moni-network
  moni-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

services:

  user-db:
    image: postgres:16-alpine
    container_name: user_db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "25432:5432"
    volumes:
      - ./.docker-volumes/user-db:/var/lib/postgresql/data

  portfolio-db:
    image: postgres:16-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: ${PORTFOLIO_DB_USERNAME}
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
    ports:
      - "25433:5432"
    volumes:
      - ./.docker-volumes/portfolio-db:/var/lib/postgresql/data

  stock-db:
    image: postgres:16-alpine
    container_name: stock_db
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: ${STOCK_DB_USERNAME}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD}
    ports:
      - "25434:5432"
    volumes:
      - ./.docker-volumes/stock-db:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: notification_db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "25435:5432"
    volumes:
      - ./.docker-volumes/notification-db:/var/lib/postgresql/data

  trade-db:
    image: postgres:16-alpine
    container_name: trade_db
    environment:
      POSTGRES_DB: trade_db
      POSTGRES_USER: ${TRADE_DB_USERNAME}
      POSTGRES_PASSWORD: ${TRADE_DB_PASSWORD}
    ports:
      - "25436:5432"
    volumes:
      - ./.docker-volumes/trade-db:/var/lib/postgresql/data

  payment-db:
    image: postgres:16-alpine
    container_name: payment_db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "25437:5432"
    volumes:
      - ./.docker-volumes/payment-db:/var/lib/postgresql/data

  ai-db:
    image: pgvector/pgvector:pg17
    container_name: ai_db
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: ${AI_DB_USERNAME}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "25438:5432"
    volumes:
      - ./.docker-volumes/ai-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql #추가


  redis:
    image: redis:7.2-alpine
    container_name: moni_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./.docker-volumes/redis:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: moni_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    volumes:
      - ./.docker-volumes/zookeeper:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: moni_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_HOST_IP}:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    volumes:
      - ./.docker-volumes/kafka:/var/lib/kafka/data

  # Redis Cluster (stock-service 전용 — 3 master, no replica)
  redis-cluster-0:
    image: redis:7.2-alpine
    container_name: redis_cluster_0
    networks:
      moni-network:
        ipv4_address: 172.24.0.10
    command: >
      redis-server --port ${REDIS_CLUSTER_PORT_0}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname ${REDIS_CLUSTER_HOST}
      --cluster-announce-port ${REDIS_CLUSTER_PORT_0}
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "${REDIS_CLUSTER_PORT_0}:${REDIS_CLUSTER_PORT_0}"
    volumes:
      - ./.docker-volumes/redis-cluster-0:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CLUSTER_PORT_0} -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-1:
    image: redis:7.2-alpine
    container_name: redis_cluster_1
    networks:
      moni-network:
        ipv4_address: 172.24.0.11
    command: >
      redis-server --port ${REDIS_CLUSTER_PORT_1}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname ${REDIS_CLUSTER_HOST}
      --cluster-announce-port ${REDIS_CLUSTER_PORT_1}
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "${REDIS_CLUSTER_PORT_1}:${REDIS_CLUSTER_PORT_1}"
    volumes:
      - ./.docker-volumes/redis-cluster-1:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CLUSTER_PORT_1} -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-2:
    image: redis:7.2-alpine
    container_name: redis_cluster_2
    networks:
      moni-network:
        ipv4_address: 172.24.0.12
    command: >
      redis-server --port ${REDIS_CLUSTER_PORT_2}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --requirepass ${REDIS_CLUSTER_PASSWORD}
      --masterauth ${REDIS_CLUSTER_PASSWORD}
      --cluster-announce-hostname ${REDIS_CLUSTER_HOST}
      --cluster-announce-port ${REDIS_CLUSTER_PORT_2}
      --cluster-preferred-endpoint-type hostname
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
    ports:
      - "${REDIS_CLUSTER_PORT_2}:${REDIS_CLUSTER_PORT_2}"
    volumes:
      - ./.docker-volumes/redis-cluster-2:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CLUSTER_PORT_2} -a ${REDIS_CLUSTER_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 클러스터 초기화 — 첫 기동 시에만 실행, 이후 재시작 시 || true 로 무시
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: redis_cluster_init
    networks:
      - moni-network
    depends_on:
      redis-cluster-0:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
    command: >
      sh -c "
      IP0=$$(getent hosts redis-cluster-0 | awk '{print $$1}') &&
      IP1=$$(getent hosts redis-cluster-1 | awk '{print $$1}') &&
      IP2=$$(getent hosts redis-cluster-2 | awk '{print $$1}') &&
      redis-cli -a $$REDIS_CLUSTER_PASSWORD --cluster create
      $$IP0:7000 $$IP1:7001 $$IP2:7002
      --cluster-replicas 0 --cluster-yes || true"
    environment:
      REDIS_CLUSTER_PASSWORD: ${REDIS_CLUSTER_PASSWORD}
