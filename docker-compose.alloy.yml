# 서비스 EC2 서버용 Alloy 사이드카 단독 compose
# 모니터링 서버와 분리된 서비스 서버(user-service-ec2 등)에서 실행
#
# 사용:
#   HOST_NAME=user-service-ec2 \
#   LOKI_URL=http://<monitor-server-ip>:3100/loki/api/v1/push \
#   PROMETHEUS_REMOTE_WRITE_URL=http://<monitor-server-ip>:9090/api/v1/write \
#   EUREKA_URL=http://<eureka-ip>:8761/eureka \
#   docker compose -f docker-compose.alloy.yml up -d
#
# 또는 .env.alloy 파일에 환경변수 작성 후 docker compose --env-file .env.alloy up -d

networks:
  default:
    name: moni-network
    external: true

services:
  alloy:
    image: grafana/alloy:latest
    container_name: moni-alloy-sidecar
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitor/alloy/config.prod.alloy:/etc/alloy/config.alloy:ro
      - /var/log/services:/var/log/services:ro
    ports:
      - "127.0.0.1:12345:12345"
    environment:
      LOKI_URL: ${LOKI_URL}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL}
      EUREKA_URL: ${EUREKA_URL}
      HOST_NAME: ${HOST_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12345/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
