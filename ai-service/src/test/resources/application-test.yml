spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:http://config-server:8888

  datasource:
    driver-class-name: org.postgresql.Driver
    url: {AI_TEST_DB_URL:jdbc:postgresql://localhost:5432/moni }
    username: {AI_TEST_DB_USERNAME:jieunpark}
    password: {AI_TEST_DB_PASSWORD}

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true


naver:
  news:
    base-url : ${NAVER_BASE_URL:https://openapi.naver.com/v1/search/news.json}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

