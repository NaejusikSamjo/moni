name: CI

on:
  push:
    branches: [master, develop, stage]

  pull_request:
    branches: [master, develop, stage]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      changed_services: ${{ steps.detect.outputs.changed_services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    env:
      COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message || 'no message' }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && github.base_ref == 'stage' && '0' || '1' }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check stage PR limit
        id: stage-check
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          COUNT=$(gh pr list --base stage --state open --json number --jq length)
          if [ "$COUNT" -gt 1 ]; then
            echo "exceeded=true" >> $GITHUB_OUTPUT
            echo "stage 브랜치 동시 PR은 1개만 허용됩니다. 현재 열린 PR: ${COUNT}개"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify stage limit exceeded
        if: failure() && steps.stage-check.outputs.exceeded == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "stage PR 동시 배포 제한 초과"
          color: 15548997
          message: "stage 브랜치에 이미 열린 PR이 있습니다. 기존 PR 완료 후 다시 시도하세요."
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Notify start
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 시작"
          color: 3447003
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Build
        run: ./gradlew clean build

      - name: Detect changed services
        id: detect
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          ALL="config-server eureka-server api-gateway user-service trade-service stock-service portfolio-service notification-service payment-service ai-service admin-service"

          CHANGED=$(git diff --name-only origin/stage...HEAD)

          if echo "$CHANGED" | grep -qE "^(common/|common-logging/|build\.gradle$|settings\.gradle$|gradle/)"; then
            CHANGED_SERVICES="$ALL"
          else
            CHANGED_SERVICES=""
            for SERVICE in $ALL; do
              if echo "$CHANGED" | grep -q "^${SERVICE}/"; then
                CHANGED_SERVICES="$CHANGED_SERVICES $SERVICE"
              fi
            done

            # config-server/src/main/resources/configs/<서비스명>.yml 변경 시
            # 해당 서비스도 재시작해야 새 설정을 적용받음
            while IFS= read -r FILE; do
              SERVICE_NAME=$(basename "$FILE" .yml)
              if [[ " $ALL " == *" $SERVICE_NAME "* ]] && [[ " $CHANGED_SERVICES " != *" $SERVICE_NAME "* ]]; then
                CHANGED_SERVICES="$CHANGED_SERVICES $SERVICE_NAME"
              fi
            done < <(echo "$CHANGED" | grep "^config-server/src/main/resources/configs/")

            CHANGED_SERVICES="${CHANGED_SERVICES# }"
          fi

          echo "changed_services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED_SERVICES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          echo "Changed: $CHANGED_SERVICES"

      - name: Upload JAR artifacts
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: |
            */build/libs/*.jar
            !*/build/libs/*-plain.jar
          retention-days: 1

      - name: Notify success
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 성공"
          color: 5763719
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Notify failure
        if: failure() && steps.stage-check.outputs.exceeded != 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 실패"
          color: 15548997
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

  deploy:
    needs: build
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'stage' &&
      needs.build.outputs.has_changes == 'true'
    uses: ./.github/workflows/cd-service.yml
    with:
      changed_services: ${{ needs.build.outputs.changed_services }}
    secrets: inherit