name: CI

on:
  push:
    branches: [master, develop, stage]

  pull_request:
    branches: [master, develop, stage]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      pull-requests: read

    env:
      COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message || 'no message' }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check stage PR limit
        id: stage-check
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          COUNT=$(gh pr list --base stage --state open --json number --jq length)
          if [ "$COUNT" -gt 1 ]; then
            echo "exceeded=true" >> $GITHUB_OUTPUT
            echo "stage 브랜치 동시 PR은 1개만 허용됩니다. 현재 열린 PR: ${COUNT}개"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify stage limit exceeded
        if: failure() && steps.stage-check.outputs.exceeded == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "stage PR 동시 배포 제한 초과"
          color: 15548997
          message: "stage 브랜치에 이미 열린 PR이 있습니다. 기존 PR 완료 후 다시 시도하세요."
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Notify start
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 시작"
          color: 3447003
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Build
        run: ./gradlew clean build

      - name: Notify success
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 성공"
          color: 5763719
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Trigger CD
        if: success() && github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: gh workflow run cd-service.yml --ref ${{ github.head_ref }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "CI 실패"
          color: 15548997
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}