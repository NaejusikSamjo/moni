groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="moni-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "서비스 다운: {{ $labels.application }}"
          description: "{{ $labels.application }} ({{ $labels.instance }}) 가 1분 이상 응답하지 않습니다."

      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{job="moni-services", status=~"5.."}[5m])
          /
          rate(http_server_requests_seconds_count{job="moni-services"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "높은 5xx 비율: {{ $labels.application }}"
          description: "{{ $labels.application }} 의 5xx 오류율이 2분간 5%를 초과합니다."
