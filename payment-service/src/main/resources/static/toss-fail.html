<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빌링키 발급 실패</title>
  <style>
    body { font-family: sans-serif; max-width: 540px; margin: 40px auto; padding: 0 20px; }
    .card { border: 1px solid #fecaca; background: #fff5f5; border-radius: 10px; padding: 20px 24px; }
    h2 { color: #dc2626; margin-top: 0; }
    .field-label { font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 4px; }
    .field-value { font-family: monospace; font-size: 13px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; word-break: break-all; }
    a { color: #3182f6; }
  </style>
</head>
<body>
<div class="card">
  <h2>❌ 빌링키 발급 실패</h2>
  <div id="detail"></div>
  <p><a href="/toss-billing-test.html">← 테스트 페이지로 돌아가기</a></p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code') || '알 수 없음';
  const message = params.get('message') || '알 수 없는 오류';
  document.getElementById('detail').innerHTML = `
    <div class="field-label">에러 코드</div>
    <div class="field-value">${code}</div>
    <div class="field-label">에러 메시지</div>
    <div class="field-value">${message}</div>`;
</script>
</body>
</html>
