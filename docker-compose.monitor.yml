networks:
  default:
    name: moni-network
    external: true

services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: moni-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitor/tempo.yaml:/etc/tempo.yaml
      - ./.docker-volumes/tempo:/tmp/tempo
    ports:
      - "${TEMPO_GRPC_PORT}:4317"       # OTLP gRPC — 서비스 EC2(10.0.3.72)에서 접근
      - "127.0.0.1:4318:4318"           # OTLP HTTP
      - "127.0.0.1:3200:3200"           # Tempo HTTP API (Grafana → Tempo)

  loki:
    image: grafana/loki:3.3.2
    container_name: moni-loki
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./monitor/loki-config.yaml:/etc/loki/local-config.yaml
      - ./.docker-volumes/loki:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: moni-promtail
    volumes:
      - ./logs:/var/log/services:ro
      - ./monitor/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: moni-prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /etc/prometheus/prometheus.yml /tmp/prometheus.yml &&
        sed -i "s/\$${SERVICE_PRIVATE_IP}/${SERVICE_PRIVATE_IP}/g" /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --web.enable-remote-write-receiver
    environment:
      SERVICE_PRIVATE_IP: ${SERVICE_PRIVATE_IP}
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitor/rules:/etc/prometheus/rules:ro
      - ./.docker-volumes/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:13.1.0
    container_name: moni-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Okta
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OKTA_GRAFANA_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OKTA_GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/userinfo
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "${OKTA_GRAFANA_ISSUER_URI}/v1/logout?post_logout_redirect_uri=${GRAFANA_ROOT_URL}&client_id=${OKTA_GRAFANA_CLIENT_ID}"
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning
      - ./monitor/grafana/dashboards:/var/lib/grafana/dashboards
      - ./.docker-volumes/grafana:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus