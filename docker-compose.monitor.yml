networks:
  default:
    name: moni-network
    external: true

services:
  tempo:
    image: grafana/tempo:latest
    container_name: moni-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitor/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitor/loki-config.yaml:/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./logs:/var/log/services:ro
      - ./monitor/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning